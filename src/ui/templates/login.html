{% extends "base.html" %}
{% block content %}
<form action="/login" method="post" class="auth-form">
  <h1 class="auth-form__title">Sign in</h1>
  {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
  <input type="hidden" name="return" value="{{ return_to | default('/recipes') }}">
  <label>Email
    <input type="email" name="email" value="{{ email | default('') }}" autocomplete="email" autofocus required>
  </label>
  <label>Password
    <input type="password" name="password" autocomplete="current-password" required>
  </label>
  <button type="submit" class="btn btn--primary auth-form__submit">Sign in</button>
  <div class="auth-form__links">
    <a href="/forgot">Forgot your password?</a>
    <a href="/register">Create an account</a>
  </div>
</form>
{% endblock %}

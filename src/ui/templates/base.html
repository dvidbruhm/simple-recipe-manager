<!DOCTYPE html>
<html lang="en" data-theme="{{ theme | default('neutral') }}" data-mode="{{ mode | default('dark') }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title | default('recipes') }} · recipes</title>
  <link rel="stylesheet" href="/static/app.css">
  {% if theme_font %}<link rel="stylesheet" href="{{ theme_font }}">{% endif %}
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <script src="/static/htmx.min.js" defer></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="{{ theme_color | default('#161617') }}">
  <link rel="apple-touch-icon" href="/static/icons/192.png">
  <meta name="apple-mobile-web-app-title" content="Recipes">
</head>
<body>
  <header class="site-header">
    <a href="/recipes" class="logo" aria-label="recipes"><img src="/static/favicon.svg" alt="" class="logo-icon"></a>
    {% block header_extra %}<span class="flex-1" aria-hidden="true"></span>{% endblock %}
    <button type="button" id="pwa-install" class="btn pwa-install-btn" hidden aria-label="Install app">Install</button>
    <a href="/settings" class="btn settings-gear" aria-label="Settings">
      <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </a>
  </header>
  <main class="site-main">
    {% block content %}{{ body_content | safe }}{% endblock %}
  </main>
  <div id="global-toast-area" class="global-toast-area" aria-live="polite"></div>
  <script>
  function showPwaToast(message, actionLabel, action) {
    const area = document.getElementById("global-toast-area");
    if (!area) return;
    const el = document.createElement("div");
    el.className = "toast";
    el.setAttribute("data-toast", "");
    el.setAttribute("role", "status");
    const msg = document.createElement("span");
    msg.className = "toast-msg";
    msg.textContent = message;
    el.appendChild(msg);
    if (actionLabel && action) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn toast-action-btn";
      btn.textContent = actionLabel;
      btn.addEventListener("click", () => {
        action();
        if (el.parentNode) el.remove();
      });
      el.appendChild(btn);
    }
    const close = document.createElement("button");
    close.type = "button";
    close.className = "toast-close";
    close.setAttribute("aria-label", "Dismiss");
    close.innerHTML = "&times;";
    close.addEventListener("click", () => {
      if (el.parentNode) el.remove();
    });
    el.appendChild(close);
    area.appendChild(el);
    setTimeout(() => {
      if (el.parentNode) el.remove();
    }, 10000);
  }
  window.showPwaToast = showPwaToast;

  document.addEventListener("htmx:beforeOnLoad", (e) => {
    const status = e.detail && e.detail.xhr && e.detail.xhr.status;
    if (status >= 400 && status !== 401) {
      const target = e.detail && e.detail.target;
      if (target && target.id === "grid") {
        showPwaToast("Couldn't update the recipe grid.", null, null);
      }
    }
  });

  document.addEventListener("click", (e) => {
    const link = e.target.closest && e.target.closest("[data-back-link]");
    if (!link) return;
    if (document.referrer && document.referrer !== location.href && new URL(document.referrer).origin === location.origin) {
      e.preventDefault();
      history.back();
    }
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").then((reg) => {
        reg.addEventListener("updatefound", () => {
          const newWorker = reg.installing;
          if (!newWorker) return;
          newWorker.addEventListener("statechange", () => {
            if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
              showPwaToast("Update available", "Reload", () => {
                newWorker.postMessage("skip-waiting");
                location.reload();
              });
            }
          });
        });
      }).catch(() => {});
    });

    let deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById("pwa-install");
      if (btn) btn.hidden = false;
    });
    window.addEventListener("appinstalled", () => {
      const btn = document.getElementById("pwa-install");
      if (btn) btn.hidden = true;
      deferredPrompt = null;
    });
    document.addEventListener("click", (e) => {
      const btn = e.target.closest && e.target.closest("#pwa-install");
      if (!btn || !deferredPrompt) return;
      e.preventDefault();
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => {
        deferredPrompt = null;
        btn.hidden = true;
      });
    });

    window.addEventListener("offline", () => {
      showPwaToast("You're offline — changes may not save", null, null);
    });

    document.addEventListener("htmx:responseError", (e) => {
      const detail = e.detail || {};
      const status = detail.xhr && detail.xhr.status;
      let msg = "Connection problem — please retry.";
      if (status === 401) msg = "Your session has expired. Reloading…";
      else if (status === 403) msg = "You don't have permission to do that.";
      else if (status === 404) msg = "That item could not be found.";
      else if (status >= 500) msg = "Server error — please try again in a moment.";
      showPwaToast(msg, status === 401 ? "Reload" : null, status === 401 ? () => location.reload() : null);
    });
  }
  </script>
</body>
</html>
